openapi: 3.0.3
info:
  title: MoneyMentor Kenya API
  version: 2.1.0
  description: >-
    HandyNear provider income and expenses plus simulated customer wallets in KES. API key and
    role-appropriate bearer token required. Savings and investment provider routes retired. Routes retain /api
    prefix. Booking registration requires only the server-to-server API key.
servers:
  - url: http://localhost:5001/api
    description: Isolated README demo (npm run start:demo)
  - url: http://localhost:5000/api
    description: Existing local project (npm start)
security:
  - apiKeyAuth: []
    bearerAuth: []
paths:
  /handymen/{handymanId}/income-summaries:
    get:
      summary: Get a handyman's monthly income summary
      operationId: getMonthlyIncomeSummary
      tags:
        - Income
      parameters:
        - $ref: '#/components/parameters/HandymanId'
        - name: month
          in: query
          required: true
          description: Month being requested
          schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            example: 2026-09
      responses:
        '200':
          description: Monthly income summary returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSummary'
              example:
                handyman_id: 1
                month: 2026-09
                total_income: 5000
                total_expenses: 0
                net_income: 5000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid X-API-Key, or missing/invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing or invalid API key
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: More than 100 requests per key per minute. Retry after the indicated delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Rate limit exceeded. Try again later.
        '500':
          description: Database operation denied by its permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database permissions are not configured for this operation.
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database unavailable. Check that MySQL is running and the database has been set up.
      description: >-
        Sum stored income and expenses for the calendar month, scoped to the authenticated provider. Month
        uses YYYY-MM, year at least 1000. Empty month totals are zero. net_income = total_income -
        total_expenses, rounded to two decimals.
      security:
        - apiKeyAuth: []
          bearerAuth: []
  /handymen/{handymanId}/expenses:
    post:
      summary: Create an expense
      operationId: createExpense
      tags:
        - Expenses
      parameters:
        - $ref: '#/components/parameters/HandymanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
            example:
              description: Replacement tools
              category: Equipment
              amount: 2500
              expense_date: '2026-09-29'
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
              example:
                id: 1
                handyman_id: 1
                description: Replacement tools
                category: Equipment
                amount: 2500
                expense_date: '2026-09-29'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid X-API-Key, or missing/invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing or invalid API key
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: JSON request body exceeds 16 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Request is too large
        '429':
          description: More than 100 requests per key per minute. Retry after the indicated delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Rate limit exceeded. Try again later.
        '500':
          description: Database operation denied by its permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database permissions are not configured for this operation.
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database unavailable. Check that MySQL is running and the database has been set up.
      security:
        - apiKeyAuth: []
          bearerAuth: []
  /expenses/{expenseId}:
    patch:
      summary: Update an existing expense
      operationId: updateExpense
      tags:
        - Expenses
      parameters:
        - name: expenseId
          in: path
          required: true
          description: Unique expense identifier
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePatch'
            example:
              amount: 3000
      responses:
        '200':
          description: Expense updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
              example:
                id: 1
                handyman_id: 1
                description: Replacement tools
                category: Equipment
                amount: 3000
                expense_date: '2026-09-29'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid X-API-Key, or missing/invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing or invalid API key
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: JSON request body exceeds 16 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Request is too large
        '429':
          description: More than 100 requests per key per minute. Retry after the indicated delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Rate limit exceeded. Try again later.
        '500':
          description: Database operation denied by its permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database permissions are not configured for this operation.
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database unavailable. Check that MySQL is running and the database has been set up.
      description: >-
        Partial update of an owned expense. At least one supported field required. Omitted fields are
        preserved. Repeated identical updates have the same end state.
      security:
        - apiKeyAuth: []
          bearerAuth: []
    delete:
      summary: Delete an existing expense
      operationId: deleteExpense
      tags:
        - Expenses
      parameters:
        - name: expenseId
          in: path
          required: true
          description: Unique expense identifier
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '204':
          description: Expense deleted successfully; no response body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid X-API-Key, or missing/invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Missing or invalid API key
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: More than 100 requests per key per minute. Retry after the indicated delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Rate limit exceeded. Try again later.
        '500':
          description: Database operation denied by its permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database permissions are not configured for this operation.
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database unavailable. Check that MySQL is running and the database has been set up.
      security:
        - apiKeyAuth: []
          bearerAuth: []
  /health:
    get:
      summary: Public connectivity check
      security: []
      responses:
        '200':
          description: API and database connected
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - database
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
              example:
                status: ok
                database: connected
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Database unavailable. Check that MySQL is running and the database has been set up.
  /customers/{customerId}/wallet:
    get:
      summary: Read own simulated wallet balance
      operationId: getCustomerWallet
      tags:
        - Wallet
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Balance in whole KES cents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /customers/{customerId}/wallet/topups:
    post:
      summary: Add simulated credit to own wallet
      operationId: topupCustomerWallet
      tags:
        - Wallet
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Reuse the same key for retries of one operation. A different request with the same customer/key
            returns 409.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - amount_cents
              properties:
                amount_cents:
                  type: integer
                  minimum: 1
                  maximum: 1000000000
            example:
              amount_cents: 100000
      responses:
        '201':
          description: >-
            Created or replay of original successful request. Balance is the historical balance immediately
            after this transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
        '400':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /bookings/{bookingId}/pay:
    post:
      summary: Pay a trusted registered booking from the authenticated customer wallet
      operationId: payBooking
      tags:
        - Wallet
      description: >-
        Empty body only. Booking price, customer and handyman are registered by the trusted administrator.
        Successful payment also records provider income. Original idempotency key replays 201. A paid booking
        with a new key returns 409. Refunds require a future contract change.
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Reuse the same key for retries of one operation. A different request with the same customer/key
            returns 409.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,100}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Simulated payment committed or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
        '400':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /customers/{customerId}/wallet/transactions:
    get:
      summary: Read own wallet transaction history, newest first
      operationId: getWalletTransactions
      tags:
        - Wallet
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: History.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletTransaction'
        '400':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: >-
            Invalid input, missing credentials, ownership/not found, conflict, rate limit, or service failure
            as applicable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /bookings/{bookingId}:
    put:
      summary: Register a booking (create-only, server-to-server)
      operationId: registerBooking
      security:
        - apiKeyAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - customer_id
                - handyman_id
                - amount_cents
              properties:
                customer_id:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                handyman_id:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                amount_cents:
                  type: integer
                  minimum: 1
                  maximum: 1000000000
      responses:
        '201':
          description: >-
            Pending booking registered; response includes id, customer_id, handyman_id, amount_cents, status,
            currency and simulated.
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid API key
        '404':
          description: Customer wallet or handyman not found
        '409':
          description: Booking ID already exists; existing record unchanged
        '429':
          description: Rate limit exceeded
        '503':
          description: Database unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        HS256 JWT. sub is the handyman ID string; exp, iss (moneymentor-local) and aud (moneymentor-api) are
        required. Missing or invalid token returns 401. Another provider resource returns 404. Local
        development tokens are issued by an administrator CLI, not a public login endpoint.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    HandymanId:
      name: handymanId
      in: path
      required: true
      description: Unique HandyNear provider identifier
      schema:
        type: integer
        format: int32
        minimum: 1
  schemas:
    ExpenseInput:
      type: object
      required:
        - description
        - category
        - amount
        - expense_date
      properties:
        description:
          type: string
          maxLength: 200
          example: Purchased replacement tools
          minLength: 1
          pattern: .*\S.*
        category:
          type: string
          maxLength: 40
          example: Equipment
          minLength: 1
          pattern: .*\S.*
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 2500
          maximum: 9999999999.99
          multipleOf: 0.01
        expense_date:
          type: string
          format: date
          example: '2026-09-09'
          description: Valid calendar date, YYYY-MM-DD, year 1000 or later.
      additionalProperties: false
    Expense:
      allOf:
        - type: object
          required:
            - id
            - handyman_id
          properties:
            id:
              type: integer
              example: 12
            handyman_id:
              type: integer
              example: 4
        - $ref: '#/components/schemas/ExpenseInput'
    IncomeSummary:
      type: object
      properties:
        handyman_id:
          type: integer
          example: 4
        month:
          type: string
          example: 2026-09
        total_income:
          type: number
          format: double
          example: 85000
        total_expenses:
          type: number
          format: double
          example: 21500
        net_income:
          type: number
          format: double
          example: 63500
      required:
        - handyman_id
        - month
        - total_income
        - total_expenses
        - net_income
    SavingsGoal:
      type: object
      properties:
        id:
          type: integer
          example: 3
        handyman_id:
          type: integer
          example: 4
        goal_amount:
          type: number
          format: double
          example: 100000
        current_amount:
          type: number
          format: double
          example: 45000
        progress_percentage:
          type: number
          format: double
          example: 45
      required:
        - id
        - handyman_id
        - goal_amount
        - current_amount
        - progress_percentage
    InvestmentProjection:
      type: object
      properties:
        handyman_id:
          type: integer
          example: 4
        initial_amount:
          type: number
          format: double
          example: 50000
        monthly_contribution:
          type: number
          format: double
          example: 5000
        annual_rate:
          type: number
          format: double
          example: 8
        years:
          type: integer
          example: 5
        projected_value:
          type: number
          format: double
          example: 440000
      required:
        - handyman_id
        - initial_amount
        - monthly_contribution
        - annual_rate
        - years
        - projected_value
    Error:
      type: object
      properties:
        error:
          type: string
          example: An error occurred
      required:
        - error
    ExpensePatch:
      type: object
      properties:
        description:
          type: string
          maxLength: 200
          example: Purchased replacement tools
          minLength: 1
          pattern: .*\S.*
        category:
          type: string
          maxLength: 40
          example: Equipment
          minLength: 1
          pattern: .*\S.*
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 2500
          maximum: 9999999999.99
          multipleOf: 0.01
        expense_date:
          type: string
          format: date
          example: '2026-09-09'
          description: Valid calendar date, YYYY-MM-DD, year 1000 or later.
      additionalProperties: false
      minProperties: 1
    Wallet:
      type: object
      required:
        - customer_id
        - balance_cents
        - currency
        - simulated
      properties:
        customer_id:
          type: integer
        balance_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
            - KES
        simulated:
          type: boolean
          enum:
            - true
    WalletTransaction:
      type: object
      required:
        - id
        - customer_id
        - type
        - amount_cents
        - balance_after_cents
        - booking_id
        - currency
        - simulated
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        type:
          type: string
          enum:
            - topup
            - payment
        amount_cents:
          type: integer
        balance_after_cents:
          type: integer
        booking_id:
          type: integer
          nullable: true
        currency:
          type: string
          enum:
            - KES
        simulated:
          type: boolean
          enum:
            - true
        created_at:
          type: string
          description: Present in transaction history, database timestamp.
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: month must use YYYY-MM format.
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: A valid bearer token is required.
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Expense not found.
