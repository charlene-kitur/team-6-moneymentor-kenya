openapi: 3.0.3
info:
  title: MoneyMentor Kenya API
  version: 1.0.0
  description: >-
    API that allows HandyNear providers to access income summaries, manage expenses, monitor savings
    goals, and view investment projections.
     Contract routes use provider-owned data. Local tracker extensions use separate tables and cannot access provider records.
servers:
  - url: 'http://localhost:5000/api'
    description: Local development server
security:
  - bearerAuth: []
paths:
  '/handymen/{handymanId}/income-summaries':
    get:
      summary: Get a handyman's monthly income summary
      operationId: getMonthlyIncomeSummary
      tags:
        - Income
      parameters:
        - $ref: '#/components/parameters/HandymanId'
        - name: month
          in: query
          required: true
          description: Month being requested
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: 2026-09
      responses:
        '200':
          description: Monthly income summary returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: >-
        Sum stored income and expenses for the calendar month, scoped to the authenticated provider.
        Month uses YYYY-MM, year at least 1000. Empty month totals are zero. net_income =
        total_income - total_expenses, rounded to two decimals.
  '/handymen/{handymanId}/expenses':
    post:
      summary: Create an expense
      operationId: createExpense
      tags:
        - Expenses
      parameters:
        - $ref: '#/components/parameters/HandymanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/expenses/{expenseId}':
    patch:
      summary: Update an existing expense
      operationId: updateExpense
      tags:
        - Expenses
      parameters:
        - name: expenseId
          in: path
          required: true
          description: Unique expense identifier
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePatch'
      responses:
        '200':
          description: Expense updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: >-
        Partial update of an owned expense. At least one supported field required. Omitted fields
        are preserved. Repeated identical updates have the same end state.
    delete:
      summary: Delete an existing expense
      operationId: deleteExpense
      tags:
        - Expenses
      parameters:
        - name: expenseId
          in: path
          required: true
          description: Unique expense identifier
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '204':
          description: Expense deleted successfully; no response body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/handymen/{handymanId}/savings-goals':
    get:
      summary: Get a handyman's savings-goal progress
      operationId: getSavingsGoalProgress
      tags:
        - Savings
      parameters:
        - $ref: '#/components/parameters/HandymanId'
      responses:
        '200':
          description: Savings-goal progress returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavingsGoal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: >-
        Stored provider goals. Progress = current_amount / goal_amount * 100, rounded to two
        decimals; overfunding can exceed 100%. No goals returns [].
  '/handymen/{handymanId}/investment-projections':
    get:
      summary: Get investment growth projections
      operationId: getInvestmentProjections
      tags:
        - Investments
      parameters:
        - $ref: '#/components/parameters/HandymanId'
      responses:
        '200':
          description: Investment projections returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestmentProjection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Database or authentication configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: >-
        Stored inputs: annual_rate is a percentage from 0 to 100; years is 0 to 100. Monthly
        compounding with contributions at month end; final value rounded to two decimals. At zero
        rate: initial_amount + monthly_contribution * 12 * years. No investments returns [].
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        HS256 JWT. sub is the handyman ID string; exp, iss (moneymentor-local) and aud
        (moneymentor-api) are required. Missing or invalid token returns 401. Another provider
        resource returns 404. Local development tokens are issued by an administrator CLI, not a
        public login endpoint.
  parameters:
    HandymanId:
      name: handymanId
      in: path
      required: true
      description: Unique HandyNear provider identifier
      schema:
        type: integer
        format: int32
        minimum: 1
  schemas:
    ExpenseInput:
      type: object
      required:
        - description
        - category
        - amount
        - expense_date
      properties:
        description:
          type: string
          maxLength: 200
          example: Purchased replacement tools
          minLength: 1
          pattern: .*\S.*
        category:
          type: string
          maxLength: 40
          example: Equipment
          minLength: 1
          pattern: .*\S.*
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 2500
          maximum: 9999999999.99
          multipleOf: 0.01
        expense_date:
          type: string
          format: date
          example: '2026-09-09'
          description: 'Valid calendar date, YYYY-MM-DD, year 1000 or later.'
      additionalProperties: false
    Expense:
      allOf:
        - type: object
          required:
            - id
            - handyman_id
          properties:
            id:
              type: integer
              example: 12
            handyman_id:
              type: integer
              example: 4
        - $ref: '#/components/schemas/ExpenseInput'
    IncomeSummary:
      type: object
      properties:
        handyman_id:
          type: integer
          example: 4
        month:
          type: string
          example: 2026-09
        total_income:
          type: number
          format: double
          example: 85000
        total_expenses:
          type: number
          format: double
          example: 21500
        net_income:
          type: number
          format: double
          example: 63500
      required:
        - handyman_id
        - month
        - total_income
        - total_expenses
        - net_income
    SavingsGoal:
      type: object
      properties:
        id:
          type: integer
          example: 3
        handyman_id:
          type: integer
          example: 4
        goal_amount:
          type: number
          format: double
          example: 100000
        current_amount:
          type: number
          format: double
          example: 45000
        progress_percentage:
          type: number
          format: double
          example: 45
      required:
        - id
        - handyman_id
        - goal_amount
        - current_amount
        - progress_percentage
    InvestmentProjection:
      type: object
      properties:
        handyman_id:
          type: integer
          example: 4
        initial_amount:
          type: number
          format: double
          example: 50000
        monthly_contribution:
          type: number
          format: double
          example: 5000
        annual_rate:
          type: number
          format: double
          example: 8
        years:
          type: integer
          example: 5
        projected_value:
          type: number
          format: double
          example: 440000
      required:
        - handyman_id
        - initial_amount
        - monthly_contribution
        - annual_rate
        - years
        - projected_value
    Error:
      type: object
      properties:
        error:
          type: string
          example: An error occurred
      required:
        - error
    ExpensePatch:
      type: object
      properties:
        description:
          type: string
          maxLength: 200
          example: Purchased replacement tools
          minLength: 1
          pattern: .*\S.*
        category:
          type: string
          maxLength: 40
          example: Equipment
          minLength: 1
          pattern: .*\S.*
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 2500
          maximum: 9999999999.99
          multipleOf: 0.01
        expense_date:
          type: string
          format: date
          example: '2026-09-09'
          description: 'Valid calendar date, YYYY-MM-DD, year 1000 or later.'
      additionalProperties: false
      minProperties: 1
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
